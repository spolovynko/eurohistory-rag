# Qdrant, the vector database. Phase 5.
#
# Start:  docker compose up -d
# Stop:   docker compose down          (data survives)
# Reset:  docker compose down -v       (deletes the volume)
#
# The stored vectors are a cache like Silver and Gold -- everything here can be
# rebuilt from data/gold/ with `eurohistory index`, so losing the volume costs
# an embedding pass, not data.

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: eurohistory-qdrant
    ports:
      - "6333:6333"   # HTTP API and the web dashboard
      - "6334:6334"   # gRPC, faster for bulk upserts
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage: