# Probes for the semantic answer cache. Phase 31, D-105.
#
# Each entry is one original question and two questions asked against it:
#
#   `paraphrase` -- the same question in different words. It MUST be served
#     from the cache, and a threshold that misses it is too strict.
#   `negative`   -- a near-miss. Same topic, same vocabulary, often the same
#     article, but a different question with a different answer. It MUST NOT be
#     served, and a threshold that serves it has made the system confidently
#     wrong, which is the failure this whole phase exists to detect.
#
# The negatives are the load-bearing half. A probe set of paraphrases alone
# would measure how often the cache fires and would have no way at all to
# measure how often it fires wrongly -- the two are quantities on different
# populations, and D-105 predicts them separately for exactly this reason.
#
# **`set` splits tuning from testing and the two must never be swapped.** The
# threshold is chosen on `tune` alone; `test` is scored once, afterwards, and
# its numbers are the phase's verdict. Both halves were written in one sitting,
# before a single similarity had been computed, so neither could be shaped to
# flatter a number that did not exist yet.
#
# Every original is a real question from `eval/questions.toml`, so the answers
# being cached are answers this corpus can actually give.

