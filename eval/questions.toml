# ================================================================ temporal (18)
# Phase 22's subset. Every question names a period -- a year, a range, a decade
# or a phrase that resolves to one -- and every answer key was chosen by reading
# the section, not by matching a heading.
#
# What makes these different from the sixty above: the corpus holds the same
# topic in several periods, so the words alone cannot separate them. "Cold War"
# names five sections of one article, covering 1947-1953, 1953-1962, 1962-1979,
# 1979-1985 and 1985-1991. A search that does not know what a year is has no
# reason to prefer the right one.
#
# Deliberately mixed, so this set cannot be passed by reading headings alone.
# Nine of the ten easy questions have their answer in a section whose heading
# names the period; the tenth (t-berlin-wall-fall-1989) does not, and neither do
# most of the multi answers -- "Western response: The Berlin Airlift",
# "Background", "Causes", "History", "Fall", "Effects", "New member states".
# A technique that only reads headings scores well on the first block and badly
# on the second, and that gap is worth seeing.
#
# suite = "temporal" so this block is reported on its own. The sixty above are
# untouched, byte for byte, so every comparison back to Phase 7 still holds.

# ---------------------------------------------------------------- easy (10)
# One article. The period is what separates the right section from its siblings.

[[question]]
id = "t-cold-war-1947-1953"
kind = "easy"
suite = "temporal"
text = "What was American policy toward the Soviet Union in the years between 1947 and 1953?"
expected = ["325329:3"]
note = "Cold War has five period sections. This one carries the Long Telegram, containment, the Truman Doctrine and the Korean War. The other four cover 1953-1962, 1962-1979, 1979-1985 and 1985-1991 and are the competition."

[[question]]
id = "t-cold-war-1979-1985"
kind = "easy"
suite = "temporal"
text = "Why did tensions between the superpowers rise again between 1979 and 1985?"
expected = ["325329:6"]
note = "Cold War, Renewal of tensions (1979-1985). Opens on the Saur Revolution, the Soviet invasion of Afghanistan and the end of detente. Same article and same vocabulary as the question above, a different decade."

[[question]]
id = "t-churchill-1930s"
kind = "easy"
suite = "temporal"
text = "What was Churchill doing during the 1930s, in the years before he returned to government?"
expected = ["33265:8"]
note = "Winston Churchill has twelve period sections. Wilderness Years: 1929-1939 is the answer; Prime Minister: 1940-1945 is 30,944 characters against its 6,255 and is the section a year-blind search reaches for."

[[question]]
id = "t-western-front-1916"
kind = "easy"
suite = "temporal"
text = "What were the main offensives on the Western Front in 1916?"
expected = ["51499:3"]
note = "Western Front (World War I) is split into bare year headings 1914, 1915, 1916, 1917, 1918. The 1916 section opens on Falkenhayn, bleeding France white, and the choice of Verdun. Five near-identical siblings and only the number tells them apart."

[[question]]
id = "t-atlantic-late-1940"
