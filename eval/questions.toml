expected = ["57765:5"]
note = "Battle of the Atlantic, June 1940 - February 1941. Nine period sections in that article, all about U-boats and convoys. Worded without the phrase Happy Time on purpose, which would make it a keyword question rather than a temporal one."

[[question]]
