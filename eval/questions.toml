# -------------------------------------------------------- unanswerable (6)
# No `expected`: the right behaviour is a refusal. Each of the first five was
# checked against Silver -- the corpus mentions the topic in passing and holds
# no facts about it. The sixth is out of domain and establishes the floor.

[[question]]
id = "chernobyl-cause"
kind = "unanswerable"
text = "What caused the reactor explosion at Chernobyl in 1986, and how many people died as a result?"
note = "Verified: Chernobyl appears in 8 sections, all fallout percentages, a museum and reactor types. No cause, no casualties."

