assistant = '''
The Marshall Plan, officially called the European Recovery Program (ERP), was an American initiative enacted in 1948 to provide foreign aid to Western Europe. It involved the transfer of $13.3 billion to 17 European countries to support economic recovery after World War II. The goals were to rebuild war-torn regions, remove trade barriers, modernize industry, improve European prosperity, and prevent the spread of communism. It also aimed to promote economic integration across Europe and encourage increased productivity and modern business practices. The plan operated for four years starting April 3, 1948, and was largely replaced by the Mutual Security Act in 1951. Although the Soviet Union and its allies were offered aid, they refused it under Soviet pressure. By 1952, the economies of all participant states had surpassed pre-war levels, with output at least 35% higher than in 1938. The Marshall Plan also played a major role in setting the stage for Western Europe's rapid post-war growth and was one of the first elements of European integration by erasing trade barriers and coordinating the economy continentally [1][2][3][5][4].
'''

