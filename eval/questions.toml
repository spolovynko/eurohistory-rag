[[question]]
id = "heysel-1985"
kind = "unanswerable"
suite = "extended"
text = "What happened at the Heysel Stadium in Brussels in 1985?"
note = "Verified: zero sections."

[[question]]
id = "seveso-1976"
kind = "unanswerable"
suite = "extended"
text = "What happened at the Seveso chemical plant in Italy, and how were the people living nearby affected?"
note = "Verified by reading both mentions in full, not their surrounding characters. 'Seveso' appears twice: once in Milan as the name of a river, and once in Italian economic miracle as the four words 'the Seveso chemical accident' in a list of ecological disasters. No date, no substance, no evacuation, no effects. Replaced danish-cartoons, which was written as unanswerable and is not -- Blasphemy 90469:3 carries the editorial rationale, the February 2006 protests, the bomb threat and the 2008 Islamabad embassy bombing, and the system answered it at rank 1 with a fully grounded, cited answer. That question was checked by reading a 200-character window around the regex match instead of the section, which is the identical failure this phase exists to fix, committed inside this phase. See the D-087 verdict."

[[question]]
id = "nokia-decline"
kind = "unanswerable"
suite = "extended"
text = "Why did Nokia lose its lead in mobile phones after 2007?"
note = "Verified: two mentions, both one line -- that Nokia fuelled Finnish growth in the late 1990s, and that it is a large employer. Nothing about any decline."

[[question]]
