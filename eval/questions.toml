The Berlin Wall was built primarily to prevent East German citizens from fleeing to the West [1][2]. The East German government claimed it was an "anti-fascist protective rampart" intended to dissuade aggression from the West and to counter the activities of Western agents in Eastern Europe, but most people believed its main purpose was to stop East Germans from entering or fleeing to West Berlin [2][4]. The Wall physically closed off West Berlin from East Berlin and East Germany, sealing all Eastern access points to West Berlin to prevent Easterners from leaving without a permit, which was rarely granted [5].
