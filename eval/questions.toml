# The evaluation question set -- 30 questions, four kinds.
#
# `expected` lists the Silver sections that *should* come back. It is the answer
# key, and recall is measured against it: a question is a hit at depth k if any
# listed section appears in the top k. Sections were chosen by reading
# corpus_map.txt, not by guessing what the corpus contains -- two earlier
# attempts guessed and both produced "unanswerable" questions the corpus could
# answer perfectly well.
#
# The six unanswerable questions carry no `expected`, by design. Five are
# plausible 20th-21st century European questions this corpus genuinely cannot
# answer -- each verified by searching Silver for the topic and finding only
# passing name-drops. The sixth is out of domain entirely, and exists to
# establish the score floor that D-047 says we do not yet have.

