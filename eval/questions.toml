# ==========================================================================
# The extended set -- 30 questions, added in Phase 15. D-087.
#
# Everything above this line is Phase 7's golden thirty and is byte-identical
# to the file that produced every baseline from 2026-08-04T1623Z onward. That
# is deliberate: the golden thirty are this phase's control, and a question set
# that gets "improved" alongside a change can no longer tell you what changed.
#
# These thirty cover the six themes added in Phase 14 -- the Cold War, the
# Eastern Bloc and 1989, European integration, decolonisation, postwar society
# and economy, and Europe since 1991. Phase 14 grew the corpus 81% and not one
# retrieval number moved, because all 24 answerable golden questions are about
# 1914-1945 and all 615 new articles are about 1945-2024.
#
# Every `expected` section below was read in full before being written down,
# not searched for and assumed. The six unanswerable questions were each
# checked by searching all 8,894 Silver sections for the topic: three return
# zero sections, two return only a name with no facts attached, and the last is
# out of domain on purpose, as a second floor point beside transformer-attention.

