# --------------------------------------------------------------- multi (8)
# The answer needs two or more articles. Phase 5 found retrieval fills every
# slot with the single strongest topic, so this is the kind expected to fail.

[[question]]
id = "versailles-vs-trianon"
kind = "multi"
text = "How did the Treaty of Trianon differ from the Treaty of Versailles in what it took from the defeated country?"
expected = ["30030:3", "211393:2", "211393:3"]
