note = "CORRECTED after the D-096 comparison closed. This was written as unanswerable and it is not. The check that passed it read a window around a regex match instead of the section -- the identical mistake recorded in the D-087 verdict for seveso-1976, committed inside the phase whose own file cites it. Read properly, Angela Merkel (Chancellorship) carries a COVID-19 subsection with Germany's crisis team and containment policy, Ursula von der Leyen (President of the European Commission) carries the Schengen border-control decision and Next Generation EU across twelve mentions, and Italy (History) carries the extraordinary economic measures. The system answered it from five sources, grounded and cited, in both Phase 22 runs. Those two runs keep the old empty key in their own records and remain comparable to each other; no run before this edit is comparable to any run after it."

# ================================================================ Phase 23
# Fourteen factual-lookup questions, suite = "factual". D-097.
#
# Each one asks for a single stated value -- an area, a date a treaty entered
# into force, a casualty total -- of the kind Wikipedia writes in an infobox.
# Silver keeps every infobox field (D-031); Gold drops them (D-041), so nothing
# retrievable carries them today.
#
# The set is half control on purpose:
#
#   9 questions whose fact appears ONLY in the infobox. Found by comparing every
#     numeric infobox value against the whole prose of its own article with
#     commas and spaces normalised away (715 such facts corpus-wide), then
#     verified by READING every section of the article. Not a window around a
#     regex match -- that mistake produced seveso-1976 in D-087 and
#     t-pandemic-2020 in D-096, and it is not making a third appearance.
#
#   5 questions whose fact is in the prose, quoted in the note from the section
#     text. These are what the change must not damage.
#
# `expected` is the article's LEAD section, because that is where the infobox
# sits on the page and where D-097 files the fact chunk. Recall is therefore not
# the interesting number here -- `expected_answer` and the fact_rate metric are.
# `expected_answer` lists accepted written forms; the match strips commas and
# spaces, folds case, and will not match a number inside a longer number.
#
# The 78 questions above are untouched, byte for byte.

# ---------------------------------------------------------------- easy (14)

[[question]]
id = "f-west-germany-area"
kind = "easy"
suite = "factual"
text = "How large was West Germany in square kilometres?"
expected = ["33166:0"]
expected_answer = ["248,717"]
note = "INFOBOX ONLY. area_km2 = 248,717. Read all 7 sections of West Germany: the string km2 does not occur once, and the only match for 'area of' is 'the area of West Berlin'. The article never states its own size in any unit."

