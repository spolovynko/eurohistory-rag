# -------------------------------------------------------- unanswerable (6)
# No `expected`: the right behaviour is a refusal. Each of the first five was
# checked against Silver -- the corpus mentions the topic in passing and holds
# no facts about it. The sixth is out of domain and establishes the floor.

[[question]]
id = "chernobyl-cause"
kind = "unanswerable"
text = "What caused the reactor explosion at Chernobyl in 1986, and how many people died as a result?"
note = "Verified: Chernobyl appears in 8 sections, all fallout percentages, a museum and reactor types. No cause, no casualties."

[[question]]
id = "good-friday-agreement"
kind = "unanswerable"
text = "What did the Good Friday Agreement change about how Northern Ireland is governed?"
note = "Verified: zero sections mention it. 'The Troubles' appears once, in passing, in Easter Rising."

[[question]]
id = "srebrenica-1995"
kind = "unanswerable"
text = "What happened at Srebrenica in July 1995?"
note = "Verified: two mentions, both name-drops -- a list of towns and a conviction date."

[[question]]
id = "brexit-why"
kind = "unanswerable"
text = "Why did a majority of British voters choose to leave the European Union in 2016?"
note = "Verified: five mentions, all inside newspaper articles describing their own coverage."

[[question]]
id = "windrush-generation"
kind = "unanswerable"
text = "Who were the Windrush generation and why did they come to Britain?"
note = "Verified: zero sections."

[[question]]
id = "transformer-attention"
kind = "unanswerable"
text = "How does a transformer neural network decide which words to pay attention to?"
note = "Out of domain on purpose. Phase 5 scored a question like this at 0.253; this is the floor D-047 needs before any min_score can be argued for."
