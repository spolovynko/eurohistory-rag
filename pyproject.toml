[project]
name = "eurohistory-rag"
version = "0.1.0"
description = "RAG over a thematic history of 20th-21st century Europe, built from English Wikipedia."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mwparserfromhell>=0.7.2",
    "polars>=1.43.1",
    "pydantic-settings>=2.14.2",
    "typer>=0.20.0",
    "tzdata>=2026.3",
    "uvicorn>=0.52.0",
]

[project.scripts]
eurohistory = "eurohistory_rag.cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eurohistory_rag"]

[tool.ruff]
line-length = 88
target-version = "py312"
# ruff format reaches into Python code blocks inside Markdown. The snippets in
# docs/ use deliberate alignment for readability, so keep it out.
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
